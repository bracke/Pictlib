name: ci

# Every step is one command; the checking itself is done by the Ada tools of the tests crate.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: library checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ALIRE_NONINTERACTIVE: "true"
    strategy:
      fail-fast: false
      matrix:
        # Match jpeglib's runner set. macos-15-intel is deliberate: gnat_native=15.2.1 is pinned through Alire
        # and is not available for the arm64 macOS runner.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - name: Check out pictlib
        uses: actions/checkout@v7
        with:
          path: pictlib

      - name: Check out sibling crates (jpeglib, textrender, project_tools and their pins)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: pictlib

      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild=25.0.1

      - name: Raise Alire solver timeout so slow runners get a complete solution
        run: alr settings --global --set solver.timeout 600

      - name: Refresh the library's platform-local Alire lock
        working-directory: pictlib
        run: alr --non-interactive update gnat_native

      - name: Refresh the tests crate's platform-local Alire lock
        working-directory: pictlib/tests
        run: alr --non-interactive update gnat_native

      - name: Build tests and tools
        working-directory: pictlib/tests
        run: alr --non-interactive build

      - name: Install GNATprove
        run: alr install gnatprove^15

      - name: Library-complete gate without the external readers
        working-directory: pictlib/tests
        env:
          PICTLIB_FUZZ_SEED: ${{ github.run_number }}
        run: alr --non-interactive run --skip-build pictlib_complete --args=--without-conformance

      - name: Keep the fuzzer's defect, slow and stuck inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-inputs-${{ matrix.os }}
          path: pictlib/tests/artifacts/fuzz
          if-no-files-found: ignore

  conformance:
    name: encoder conformance (ImageMagick, LibreOffice)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ALIRE_NONINTERACTIVE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          path: pictlib

      - uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: pictlib

      - uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild=25.0.1

      - name: Install the package index
        run: sudo apt-get update

      - name: Install the independent PICT readers
        run: sudo apt-get install -y --no-install-recommends imagemagick libreoffice-draw

      - name: Refresh the tests crate's platform-local Alire lock
        working-directory: pictlib/tests
        run: alr --non-interactive update gnat_native

      - name: Build tests and tools
        working-directory: pictlib/tests
        run: alr --non-interactive build

      - name: Encoder conformance
        working-directory: pictlib/tests
        run: alr --non-interactive run --skip-build pictlib_conformance --args=--require
